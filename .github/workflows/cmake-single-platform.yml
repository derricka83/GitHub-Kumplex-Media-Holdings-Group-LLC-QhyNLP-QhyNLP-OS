# 🚀 Quantum SMS OS: CMake Single Platform Build Workflow
# Supports Blockchain, Python, QhyNLP, and Kernel modules
# For cross-platform CI, see: cmake-multi-platform.yml

name: 🛠️ Build & Test (Single Platform)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: 🧱 Build on Ubuntu (CMake)
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🧪 Install system dependencies
        run: sudo apt update && sudo apt install -y cmake gcc g++ python3 python3-pip

      - name: 🧹 Clean build directory
        run: |
          rm -rf build
          mkdir -p build

      - name: ⚙️ Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: 🧱 Build CMake Project
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: ✅ Run Tests
        working-directory: build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: 📦 Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quantum-sms-os-${{ env.BUILD_TYPE }}
          path: build/

